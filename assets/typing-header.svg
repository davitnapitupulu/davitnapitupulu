<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 30' width='600' height='30'>
  <style>
    text{font-family:monospace;font-size:20px;fill:#333;}
    .l1{animation: showL1 6s steps(1) infinite;}
    .l2{opacity:0;animation: showL2 6s steps(1) infinite;}
    @keyframes showL1{0%{opacity:1}49%{opacity:1}50%{opacity:0}100%{opacity:0}}
    @keyframes showL2{0%{opacity:0}49%{opacity:0}50%{opacity:1}99%{opacity:1}100%{opacity:0}}
  </style>
  <text x='0' y='22' class='l1'>Hi, I am Davit</text>
  <text x='0' y='22' class='l2'>Backend &amp; Infrastructure Engineer</text>
</svg>
